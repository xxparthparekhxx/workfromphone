[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E501 (line length) is grandfathered: the existing codebase has many long
# lines. New code should still stay near 120 cols. F/E gate real bugs.
select = ["E", "F"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/backend"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 55
show_missing = true

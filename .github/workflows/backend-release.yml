name: Backend release

on:
  push:
    tags:
      - "backend-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (required for manual runs)"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build self-contained backend
        run: uv run pyinstaller --clean --noconfirm workfromphone-backend.spec
      - name: Smoke-test binary
        run: |
          ACCESS_TOKEN=release-smoke-token PORT=18765 dist/workfromphone-backend &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/api/v1/health; then
              break
            fi
            sleep 1
          done
          curl -fsS \
            -H "Authorization: Bearer release-smoke-token" \
            http://127.0.0.1:18765/api/v1/system/snapshot
      - name: Package binary
        run: |
          tar -C dist -czf "workfromphone-backend-linux-${{ matrix.architecture }}.tar.gz" workfromphone-backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.architecture }}
          path: backend/workfromphone-backend-linux-${{ matrix.architecture }}.tar.gz

  rootfs:
    # Full Debian bookworm userland for on-device (proot) mode. Built
    # natively per arch on a runner matching the target architecture so
    # debootstrap needs no qemu cross-arch. The published tarball is a full
    # ~150-300 MB image: debootstrap base + toolchain + the backend binary
    # from the build job above (--overlay-only remains for local use).
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
            debian_arch: amd64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            debian_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install debootstrap
        run: sudo apt-get update -y && sudo apt-get install -y debootstrap
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-${{ matrix.architecture }}
          merge-multiple: true
          path: backend-dist
      - name: Build full Debian rootfs
        run: |
          tar -tzf "backend-dist/workfromphone-backend-linux-${{ matrix.architecture }}.tar.gz"
          export VERSION="${GITHUB_REF_NAME#backend-v}"
          sudo bash rootfs/build-debian-rootfs.sh "${{ matrix.debian_arch }}" \
            --out dist-rootfs \
            --backend-tar "backend-dist/workfromphone-backend-linux-${{ matrix.architecture }}.tar.gz"
          mkdir -p release
          sudo mv dist-rootfs/workfromphone-rootfs-debian-${{ matrix.architecture }}.tar.gz release/
      - name: Verify rootfs contents, launch guard, and boot
        # The image now carries a full Debian userland, so beyond the content
        # and token-guard checks we run a real boot smoke test of the image's
        # /bin/sh via chroot on the runner (a full guest boot still happens
        # on-device at setup time).
        run: |
          rm -rf /tmp/rootfs-smoke && mkdir -p /tmp/rootfs-smoke
          tar -xzf release/workfromphone-rootfs-debian-${{ matrix.architecture }}.tar.gz -C /tmp/rootfs-smoke
          test -x /tmp/rootfs-smoke/opt/workfromphone/workfromphone-backend
          test -x /tmp/rootfs-smoke/opt/workfromphone/launch.sh
          test -x /tmp/rootfs-smoke/opt/workfromphone/bootstrap.sh
          sh -n /tmp/rootfs-smoke/opt/workfromphone/launch.sh
          sh -n /tmp/rootfs-smoke/opt/workfromphone/bootstrap.sh
          cat /tmp/rootfs-smoke/opt/workfromphone/VERSION
          # The launcher must refuse to start without ACCESS_TOKEN, even on loopback.
          if ACCESS_TOKEN= PORT=18766 /tmp/rootfs-smoke/opt/workfromphone/launch.sh; then
            echo "launch.sh must fail without ACCESS_TOKEN" >&2
            exit 1
          fi
          # Real boot smoke test: the image's own /bin/sh must execute.
          boot_output="$(sudo chroot /tmp/rootfs-smoke /bin/sh -c 'echo boot-ok')"
          if [ "$boot_output" != "boot-ok" ]; then
            echo "rootfs boot smoke test failed: expected 'boot-ok', got '$boot_output'" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.architecture }}
          path: release/workfromphone-rootfs-debian-${{ matrix.architecture }}.tar.gz

  publish:
    needs: [build, rootfs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: rootfs-*
          merge-multiple: true
          path: release
      - name: Resolve version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Tag pushes carry the version in the ref; manual dispatch must
          # provide the version input.
          TAG="${REF_NAME:-$INPUT_VERSION}"
          if [ -z "$TAG" ]; then
            echo "::error::Set a backend-v* tag or provide the version input"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Publishing version tag: $TAG"
      - name: Create release manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.TAG }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = Path("release")
          artifacts = {}
          for architecture in ("x86_64", "aarch64"):
              name = f"workfromphone-backend-linux-{architecture}.tar.gz"
              archive = release / name
              artifacts[architecture] = {
                  "url": (
                      f"https://github.com/{os.environ['REPOSITORY']}/releases/"
                      f"download/{os.environ['TAG']}/{name}"
                  ),
                  "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              }
          manifest = {
              "version": os.environ["TAG"].removeprefix("backend-v"),
              "artifacts": artifacts,
          }
          (release / "backend-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          rootfs_artifacts = {}
          for architecture in ("x86_64", "aarch64"):
              name = f"workfromphone-rootfs-debian-{architecture}.tar.gz"
              archive = release / name
              rootfs_artifacts[architecture] = {
                  "url": (
                      f"https://github.com/{os.environ['REPOSITORY']}/releases/"
                      f"download/{os.environ['TAG']}/{name}"
                  ),
                  "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              }
          rootfs_manifest = {
              "version": os.environ["TAG"].removeprefix("backend-v"),
              "debian": "bookworm",
              "artifacts": rootfs_artifacts,
          }
          (release / "rootfs-manifest.json").write_text(
              json.dumps(rootfs_manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
